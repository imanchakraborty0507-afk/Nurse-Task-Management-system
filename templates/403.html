{% extends "base.html" %}
{% block title %}Access Denied (403) - MediCare{% endblock %}
{% block content %}
<div class="card text-center p-5 mx-auto my-4" style="max-width: 540px;">
  <div class="display-1 fw-bold text-danger mb-2">403</div>
  <h3 class="mb-3">Access Restricted</h3>
  <p class="text-muted mb-4">You do not have the required clinical or administrative role permissions to view this resource.</p>
  <div>
    <a href="{{ url_for('auth.dashboard') }}" class="btn btn-outline-primary px-4">
      <i class="fa-solid fa-arrow-left me-2"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
