{% extends "base.html" %}
{% block title %}Server Error (500) - MediCare{% endblock %}
{% block content %}
<div class="card text-center p-5 mx-auto my-4" style="max-width: 540px;">
  <div class="display-1 fw-bold text-warning mb-2">500</div>
  <h3 class="mb-3">Internal Server Error</h3>
  <p class="text-muted mb-4">An unexpected issue occurred while processing your request. Please try again or notify IT support.</p>
  <div>
    <a href="{{ url_for('auth.dashboard') }}" class="btn btn-primary px-4">
      <i class="fa-solid fa-rotate me-2"></i> Reload Workspace
    </a>
  </div>
</div>
{% endblock %}
