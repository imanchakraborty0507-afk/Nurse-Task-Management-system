{% extends "base.html" %}
{% block title %}Assign Clinical Task - Doctor MediCare{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h2 class="page-title">Assign Clinical Care Task</h2>
    <p class="page-subtitle">Prescribe medical care orders, medication delivery, vitals monitoring, or wound dressings.</p>
  </div>
</div>

<div class="card p-4 mx-auto" style="max-width: 800px;">
  <form method="POST" action="{{ url_for('doctor.create_task') }}">
    <div class="mb-3">
      <label class="form-label small fw-semibold">Task Title <span class="text-danger">*</span></label>
      <input type="text" class="form-control" name="task_title" placeholder="e.g. Administer IV Antibiotics (Ceftriaxone 1g)" required>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label small fw-semibold">Target Patient <span class="text-danger">*</span></label>
        <select class="form-select" name="patient_id" required>
          <option value="">-- Choose Patient --</option>
          {% for p in patients %}
          <option value="{{ p.patient_id }}" {% if selected_patient_id == p.patient_id %}selected{% endif %}>
            {{ p.name }} (Room {{ p.room_number }}, Bed {{ p.bed_number }} - {{ p.ward_name }})
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label small fw-semibold">Assign to Nurse <span class="text-danger">*</span></label>
        <select class="form-select" name="nurse_id" required>
          <option value="">-- Choose Nurse --</option>
          {% for n in nurses %}
          <option value="{{ n.nurse_id }}">{{ n.name }} ({{ n.department_name }})</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <!-- Priority Selection -->
    <div class="mb-3">
      <label class="form-label small fw-semibold d-block">Task Priority Level <span class="text-danger">*</span></label>
      <div class="d-flex gap-3 flex-wrap">
        <div class="form-check">
          <input class="form-check-input" type="radio" name="priority" id="priLow" value="LOW">
          <label class="form-check-label badge bg-light text-dark border p-2" for="priLow">
            <i class="fa-solid fa-arrow-down me-1 text-secondary"></i> LOW
          </label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="priority" id="priMed" value="MEDIUM" checked>
          <label class="form-check-label badge bg-primary-subtle text-primary border border-primary-subtle p-2" for="priMed">
            <i class="fa-solid fa-minus me-1"></i> MEDIUM
          </label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="priority" id="priHigh" value="HIGH">
          <label class="form-check-label badge bg-warning-subtle text-warning border border-warning-subtle p-2" for="priHigh">
            <i class="fa-solid fa-arrow-up me-1"></i> HIGH
          </label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="priority" id="priCrit" value="CRITICAL">
          <label class="form-check-label badge bg-danger text-white p-2" for="priCrit">
            <i class="fa-solid fa-triangle-exclamation me-1"></i> CRITICAL / URGENT
          </label>
        </div>
      </div>
    </div>

    <!-- Due Date & Time -->
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label small fw-semibold">Due Date <span class="text-danger">*</span></label>
        <input type="date" class="form-control" name="due_date" value="{{ default_date }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label small fw-semibold">Due Time <span class="text-danger">*</span></label>
        <input type="time" class="form-control" name="due_time" value="{{ default_time }}" required>
      </div>
    </div>

    <!-- Description & Instructions -->
    <div class="mb-3">
      <label class="form-label small fw-semibold">Clinical Instructions & Dosages <span class="text-danger">*</span></label>
      <textarea class="form-control" name="description" rows="4" placeholder="Specify dosage, delivery mechanism, vitals to check before administration, precautions..." required></textarea>
    </div>

    <!-- Notes -->
    <div class="mb-4">
      <label class="form-label small fw-semibold">Preliminary Doctor Remarks (Optional)</label>
      <input type="text" class="form-control" name="notes" placeholder="e.g. Patient is allergic to penicillin. Verify BP before starting infusion.">
    </div>

    <div class="d-flex justify-content-between">
      <a href="{{ url_for('doctor.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary px-4">
        <i class="fa-solid fa-paper-plane me-1"></i> Dispatch Care Task
      </button>
    </div>
  </form>
</div>
{% endblock %}
