<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Nurse Task Management Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo-icon">
          <i class="fa-solid fa-staff-snake"></i>
        </div>
        <h2 class="login-title">MediCare Portal</h2>
        <p class="login-subtitle">Hospital Staff Duty & Task Management</p>
      </div>

      <!-- Flash Alerts -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.login') }}" id="loginForm">
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="username" name="username" placeholder="Username" value="{{ username or '' }}" required autofocus>
          <label for="username"><i class="fa-regular fa-user me-2"></i>Username</label>
        </div>

        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
          <label for="password"><i class="fa-solid fa-lock me-2"></i>Password</label>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fs-6 fw-semibold">
          <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In to Portal
        </button>
      </form>

      <!-- Quick Demo Credentials Fill -->
      <div class="demo-credentials-box">
        <div class="d-flex align-items-center justify-content-between">
          <span class="small fw-semibold text-secondary"><i class="fa-solid fa-bolt text-warning me-1"></i> Quick Demo Login</span>
          <span class="badge bg-light text-muted border">1-Click Fill</span>
        </div>
        <div class="demo-btn-group">
          <button type="button" class="demo-btn" onclick="fillCredentials('admin', 'admin123')">
            <i class="fa-solid fa-user-shield text-danger d-block mb-1"></i> Admin
          </button>
          <button type="button" class="demo-btn" onclick="fillCredentials('dr_smith', 'doctor123')">
            <i class="fa-solid fa-user-doctor text-primary d-block mb-1"></i> Doctor
          </button>
          <button type="button" class="demo-btn" onclick="fillCredentials('nurse_emily', 'nurse123')">
            <i class="fa-solid fa-user-nurse text-success d-block mb-1"></i> Nurse
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function fillCredentials(u, p) {
      document.getElementById("username").value = u;
      document.getElementById("password").value = p;
      document.getElementById("loginForm").submit();
    }
  </script>
</body>
</html>
