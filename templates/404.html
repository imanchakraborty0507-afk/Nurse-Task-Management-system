{% extends "base.html" %}
{% block title %}Page Not Found (404) - MediCare{% endblock %}
{% block content %}
<div class="card text-center p-5 mx-auto my-4" style="max-width: 540px;">
  <div class="display-1 fw-bold text-muted mb-2">404</div>
  <h3 class="mb-3">Clinical Record / Page Not Found</h3>
  <p class="text-muted mb-4">The page or resource you requested does not exist or may have been relocated.</p>
  <div>
    <a href="{{ url_for('auth.dashboard') }}" class="btn btn-primary px-4">
      <i class="fa-solid fa-house me-2"></i> Return to Workspace
    </a>
  </div>
</div>
{% endblock %}
